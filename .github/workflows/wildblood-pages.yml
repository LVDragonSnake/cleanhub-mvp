name: Deploy Wildblood site to GitHub Pages

on:
  push:
    branches: [claude/wildbloogsaga-redesign-d1edeh]
    paths: ['wildblood/**', '.github/workflows/wildblood-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # site/ è già committato; il build lo rigenera per sicurezza dai sorgenti
      - name: Build
        working-directory: wildblood
        run: node build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wildblood/site

      - id: deployment
        uses: actions/deploy-pages@v4
