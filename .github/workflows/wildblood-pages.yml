name: Deploy Wildblood site

# actions/deploy-pages non e' utilizzabile: l'app GitHub di questa integrazione
# non ha il permesso di creare il sito Pages ("Resource not accessible by
# integration"). Pages e' invece attivo sul branch gh-pages, quindi il deploy
# consiste nel pubblicare li' il contenuto di wildblood/site.

on:
  push:
    branches: [claude/wildbloogsaga-redesign-d1edeh]
    paths: ['wildblood/**', '.github/workflows/wildblood-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wildblood-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: wildblood
        run: node build.mjs

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd wildblood/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy da ${GITHUB_SHA::10}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
